   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Dump Bin into Big Bin</dc:title>
    <dc:description>Dump Bin into Big Bin. Actual evaluation checkpoints. Pale shapes show central 95% empirical bootstrap distributions of binary rollout means, not training-seed variation. Yellow stars mark each method's first checkpoint with 100% success. Checkpoints through 5,000 dataset steps are shown.</dc:description>
